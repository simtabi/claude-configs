name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    # PyPI publishing is paused until the owner sets the repository (or org)
    # variable PUBLISH_PYPI to 'true'. Tags still build and release on GitHub.
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    name: publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai-configurator
    permissions:
      id-token: write  # OIDC for trusted publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
